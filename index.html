<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xrack228</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{font-family:Segoe UI,Tahoma,sans-serif}#xrack-widget{position:fixed;inset:0;width:100vw;height:100vh;border:0;border-radius:0;overflow:hidden;cursor:pointer;background:#000;box-shadow:none}#xrack-widget canvas{display:block;width:100%;height:100%}#xrack-hint{position:absolute;left:18px;bottom:18px;padding:7px 12px;border-radius:7px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;z-index:2;pointer-events:none;box-shadow:0 0 18px rgba(0,255,80,.25)}
</style>
</head>
<body>
<div id="xrack-widget"><div id="xrack-hint">xrack228.com</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.126.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.126.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {RGBShiftShader} from 'three/addons/shaders/RGBShiftShader.js';
const el=document.getElementById('xrack-widget');el.onclick=()=>window.open('https://xrack228.com/','_blank');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.Fog(0x000000,5,20);
const w=innerWidth,h=innerHeight,camera=new THREE.PerspectiveCamera(45,w/h,.1,1000);camera.position.set(0,.5,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);

// Цветовая схема флага Урала: белый сверху, зелёный по центру, чёрный снизу.
scene.add(new THREE.AmbientLight(0x404040));
const whiteLight=new THREE.PointLight(0xffffff,2.2,12);whiteLight.position.set(0,2.2,3);scene.add(whiteLight);
const greenLight=new THREE.PointLight(0x00a651,2.4,12);greenLight.position.set(0,0,-1);scene.add(greenLight);
const greenSide=new THREE.PointLight(0x007a3d,1.5,10);greenSide.position.set(-2,-.3,-2);scene.add(greenSide);

const mat=new THREE.MeshStandardMaterial({roughness:.3,metalness:.2,emissive:0x06150b,emissiveIntensity:.4,side:THREE.DoubleSide});
const card=new THREE.Mesh(new THREE.PlaneGeometry(4.5,3.2,64,48),mat);scene.add(card);
new THREE.TextureLoader().load('xrack.jpg',t=>{mat.map=t;mat.needsUpdate=true});

// Полосы флага Урала поверх карты.
const flagCanvas=document.createElement('canvas');flagCanvas.width=512;flagCanvas.height=512;const fctx=flagCanvas.getContext('2d');
function drawFlag(time){
  fctx.clearRect(0,0,512,512);const shift=Math.sin(time*.0005)*35;
  const g=fctx.createLinearGradient(0,shift,0,512+shift);
  g.addColorStop(0,'rgba(255,255,255,.34)');
  g.addColorStop(.32,'rgba(255,255,255,.22)');
  g.addColorStop(.34,'rgba(0,166,81,.30)');
  g.addColorStop(.66,'rgba(0,166,81,.34)');
  g.addColorStop(.68,'rgba(0,0,0,.38)');
  g.addColorStop(1,'rgba(0,0,0,.58)');
  fctx.fillStyle=g;fctx.fillRect(0,0,512,512);
}
drawFlag(0);const flagTexture=new THREE.CanvasTexture(flagCanvas);
const flagMaterial=new THREE.MeshBasicMaterial({map:flagTexture,transparent:true,opacity:.78,blending:THREE.NormalBlending,depthWrite:false,side:THREE.DoubleSide});
const flagPlane=new THREE.Mesh(new THREE.PlaneGeometry(4.55,3.25),flagMaterial);flagPlane.position.z=.012;card.add(flagPlane);

const starsG=new THREE.BufferGeometry(),p=new Float32Array(450*3);for(let i=0;i<p.length;i+=3){p[i]=(Math.random()-.5)*15;p[i+1]=(Math.random()-.5)*8;p[i+2]=(Math.random()-.5)*6-2}starsG.setAttribute('position',new THREE.BufferAttribute(p,3));
const stars=new THREE.Points(starsG,new THREE.PointsMaterial({color:0xffffff,size:.025,transparent:true,opacity:.75}));scene.add(stars);

const comp=new EffectComposer(renderer);comp.addPass(new RenderPass(scene,camera));const rgb=new ShaderPass(RGBShiftShader);rgb.uniforms.amount.value=.0012;comp.addPass(rgb);
let tx=0,ty=0,cx=0,cy=0;el.onmousemove=e=>{ty=(e.clientX/innerWidth*2-1)*.7;tx=-(e.clientY/innerHeight*2-1)*.5};el.onmouseleave=()=>tx=ty=0;
function loop(){
  const t=performance.now()*.001;cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;card.rotation.x=cx;card.rotation.y=cy;stars.rotation.y+=.0001;
  whiteLight.intensity=1.8+Math.sin(t*2)*.35;
  greenLight.intensity=2.0+Math.cos(t*1.7)*.45;
  greenSide.intensity=1.2+Math.sin(t*1.4)*.3;
  drawFlag(performance.now());flagTexture.needsUpdate=true;
  comp.render();requestAnimationFrame(loop)
}loop();
addEventListener('resize',()=>{const W=innerWidth,H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);comp.setSize(W,H)});
</script>
</body>
</html>

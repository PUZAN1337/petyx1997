<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xrack228</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{font-family:Segoe UI,Tahoma,sans-serif}#xrack-widget{position:fixed;top:18px;right:18px;width:360px;height:260px;border:1px solid #f00;border-radius:14px;overflow:hidden;cursor:pointer;background:#000;box-shadow:0 0 35px rgba(255,0,0,.35)}#xrack-widget canvas{display:block;width:100%;height:100%}#xrack-hint{position:absolute;left:12px;bottom:10px;padding:5px 9px;border-radius:7px;background:#000;color:#f33;font-size:11px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="xrack-widget"><div id="xrack-hint">xrack228.com</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.126.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.126.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {RGBShiftShader} from 'three/addons/shaders/RGBShiftShader.js';
const el=document.getElementById('xrack-widget');el.onclick=()=>window.open('https://xrack228.com/','_blank');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.Fog(0x000000,5,20);
const w=el.clientWidth,h=el.clientHeight,camera=new THREE.PerspectiveCamera(45,w/h,.1,1000);camera.position.set(0,.5,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(w,h);renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x220000));const light=new THREE.PointLight(0xff0000,2,12);light.position.set(0,1,3);scene.add(light);const light2=new THREE.PointLight(0xaa0000,2,10);light2.position.set(-2,0,-2);scene.add(light2);
const mat=new THREE.MeshStandardMaterial({roughness:.3,metalness:.2,emissive:0x220000,emissiveIntensity:.4,side:THREE.DoubleSide});const card=new THREE.Mesh(new THREE.PlaneGeometry(4.5,3.2,64,48),mat);scene.add(card);new THREE.TextureLoader().load('xrack.jpg',t=>{mat.map=t;mat.needsUpdate=true});
const starsG=new THREE.BufferGeometry(),p=new Float32Array(450*3);for(let i=0;i<p.length;i+=3){p[i]=(Math.random()-.5)*15;p[i+1]=(Math.random()-.5)*8;p[i+2]=(Math.random()-.5)*6-2}starsG.setAttribute('position',new THREE.BufferAttribute(p,3));const stars=new THREE.Points(starsG,new THREE.PointsMaterial({color:0xff2222,size:.025,transparent:true,opacity:.7}));scene.add(stars);
const comp=new EffectComposer(renderer);comp.addPass(new RenderPass(scene,camera));const rgb=new ShaderPass(RGBShiftShader);rgb.uniforms.amount.value=.0015;comp.addPass(rgb);
let tx=0,ty=0,cx=0,cy=0;el.onmousemove=e=>{const r=el.getBoundingClientRect();ty=((e.clientX-r.left)/r.width*2-1)*.7;tx=-((e.clientY-r.top)/r.height*2-1)*.5};el.onmouseleave=()=>tx=ty=0;
function loop(){const t=performance.now()*.001;cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;card.rotation.x=cx;card.rotation.y=cy;stars.rotation.y+=.0001;light.intensity=1.6+Math.sin(t*2)*.4;light2.intensity=1.5+Math.cos(t*1.7)*.4;comp.render();requestAnimationFrame(loop)}loop();
addEventListener('resize',()=>{const W=el.clientWidth,H=el.clientHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);comp.setSize(W,H)});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>xrack228</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a14;
    }

    #xrack-widget {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 360px;
      height: 260px;
      border: 1px solid rgba(120, 180, 255, 0.35);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: #0a0a14;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 30px rgba(80, 130, 255, 0.12);
    }

    #xrack-widget canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #xrack-hint {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 2;
      padding: 5px 9px;
      border-radius: 7px;
      background: rgba(5, 5, 15, 0.55);
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="xrack-widget" title="Открыть xrack228.com">
    <div id="xrack-hint">xrack228.com</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';

    const widget = document.getElementById('xrack-widget');

    // Открываем xrack228.com при клике по окну.
    widget.addEventListener('click', () => {
      window.open('https://xrack228.com/', '_blank', 'noopener,noreferrer');
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);
    scene.fog = new THREE.Fog(0x0a0a14, 5, 20);

    const width = widget.clientWidth;
    const height = widget.clientHeight;
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 0.5, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    widget.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x404066);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(1, 2, 3);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const backLight1 = new THREE.PointLight(0xff4da6, 1.2, 10);
    backLight1.position.set(-2, 0.5, -2);
    scene.add(backLight1);

    const backLight2 = new THREE.PointLight(0x4da6ff, 1.2, 10);
    backLight2.position.set(2, -0.3, -2);
    scene.add(backLight2);

    const colorLight1 = new THREE.PointLight(0xff9a9e, 0.9, 8);
    colorLight1.position.set(1.5, 1.2, 1.5);
    scene.add(colorLight1);

    const colorLight2 = new THREE.PointLight(0xa18cd1, 0.9, 8);
    colorLight2.position.set(-1.5, -0.8, 1.8);
    scene.add(colorLight2);

    const textureLoader = new THREE.TextureLoader();
    const geometry = new THREE.PlaneGeometry(4.5, 3.2, 64, 48);
    const material = new THREE.MeshStandardMaterial({
      roughness: 0.35,
      metalness: 0.15,
      emissive: new THREE.Color(0x111133),
      emissiveIntensity: 0.25,
      side: THREE.DoubleSide
    });

    const cardMesh = new THREE.Mesh(geometry, material);
    cardMesh.castShadow = true;
    cardMesh.receiveShadow = true;
    scene.add(cardMesh);

    textureLoader.load(
      'xrack.jpg',
      (texture) => {
        material.map = texture;
        material.needsUpdate = true;
      },
      undefined,
      () => {
        material.color = new THREE.Color(0x335577);
        material.emissive = new THREE.Color(0x112233);
        material.needsUpdate = true;
      }
    );

    const gradientCanvas = document.createElement('canvas');
    gradientCanvas.width = 512;
    gradientCanvas.height = 512;
    const ctx = gradientCanvas.getContext('2d');

    function drawGradient(time) {
      ctx.clearRect(0, 0, 512, 512);
      const t = time * 0.0008;

      const x1 = 512 * (0.5 + Math.sin(t * 0.7) * 0.25);
      const y1 = 512 * (0.5 + Math.cos(t * 0.5) * 0.2);
      const gradient1 = ctx.createRadialGradient(x1, y1, 40, x1, y1, 280);
      gradient1.addColorStop(0, 'rgba(255, 110, 199, 0.5)');
      gradient1.addColorStop(0.5, 'rgba(180, 130, 255, 0.35)');
      gradient1.addColorStop(1, 'rgba(20, 20, 60, 0)');
      ctx.fillStyle = gradient1;
      ctx.fillRect(0, 0, 512, 512);

      const x2 = 512 * (0.5 + Math.cos(t * 0.6) * 0.3);
      const y2 = 512 * (0.5 + Math.sin(t * 0.8) * 0.25);
      const gradient2 = ctx.createRadialGradient(x2, y2, 30, x2, y2, 300);
      gradient2.addColorStop(0, 'rgba(0, 201, 255, 0.45)');
      gradient2.addColorStop(0.6, 'rgba(100, 200, 255, 0.3)');
      gradient2.addColorStop(1, 'rgba(10, 10, 30, 0)');
      ctx.fillStyle = gradient2;
      ctx.fillRect(0, 0, 512, 512);

      const x3 = 512 * (0.5 + Math.sin(t * 1.1) * 0.35);
      const y3 = 512 * (0.5 + Math.cos(t * 0.9) * 0.3);
      const gradient3 = ctx.createRadialGradient(x3, y3, 20, x3, y3, 250);
      gradient3.addColorStop(0, 'rgba(255, 210, 140, 0.5)');
      gradient3.addColorStop(0.7, 'rgba(255, 160, 100, 0.25)');
      gradient3.addColorStop(1, 'rgba(40, 20, 50, 0)');
      ctx.fillStyle = gradient3;
      ctx.fillRect(0, 0, 512, 512);
    }

    drawGradient(0);
    const gradientTexture = new THREE.CanvasTexture(gradientCanvas);
    const gradientGeometry = new THREE.PlaneGeometry(4.55, 3.25);
    const gradientMaterial = new THREE.MeshBasicMaterial({
      map: gradientTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthTest: true,
      depthWrite: false,
      opacity: 0.75,
      side: THREE.DoubleSide
    });

    const gradientPlane = new THREE.Mesh(gradientGeometry, gradientMaterial);
    gradientPlane.position.z = 0.01;
    cardMesh.add(gradientPlane);

    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 600;
    const starsPositions = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
      starsPositions[i] = (Math.random() - 0.5) * 15;
      starsPositions[i + 1] = (Math.random() - 0.5) * 8;
      starsPositions[i + 2] = (Math.random() - 0.5) * 6 - 2;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));

    const starsMaterial = new THREE.PointsMaterial({
      color: 0xaaccff,
      size: 0.025,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.7,
      depthWrite: false
    });

    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const rgbShiftPass = new ShaderPass(RGBShiftShader);
    rgbShiftPass.uniforms.amount.value = 0.0015;
    rgbShiftPass.renderToScreen = true;
    composer.addPass(rgbShiftPass);

    const targetRotation = { x: 0, y: 0 };
    const currentRotation = { x: 0, y: 0 };
    const maxRotationX = 0.5;
    const maxRotationY = 0.7;

    widget.addEventListener('mousemove', (event) => {
      const rect = widget.getBoundingClientRect();
      const mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      const mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      targetRotation.y = mouseX * maxRotationY;
      targetRotation.x = mouseY * maxRotationX;
    });

    widget.addEventListener('mouseleave', () => {
      targetRotation.x = 0;
      targetRotation.y = 0;
    });

    function animate() {
      const elapsedTime = performance.now() * 0.001;
      const lerpFactor = 0.08;

      currentRotation.x += (targetRotation.x - currentRotation.x) * lerpFactor;
      currentRotation.y += (targetRotation.y - currentRotation.y) * lerpFactor;
      cardMesh.rotation.x = currentRotation.x;
      cardMesh.rotation.y = currentRotation.y;

      stars.rotation.y += 0.0001;
      stars.rotation.x = Math.sin(elapsedTime * 0.2) * 0.02;

      drawGradient(elapsedTime * 1000);
      gradientTexture.needsUpdate = true;

      const movementIntensity = Math.abs(currentRotation.x) + Math.abs(currentRotation.y);
      rgbShiftPass.uniforms.amount.value = 0.0008 + movementIntensity * 0.003;

      colorLight1.intensity = 0.7 + Math.sin(elapsedTime * 2.5) * 0.3;
      colorLight2.intensity = 0.7 + Math.cos(elapsedTime * 2.1) * 0.3;
      backLight1.intensity = 1.0 + Math.sin(elapsedTime * 1.8) * 0.3;
      backLight2.intensity = 1.0 + Math.cos(elapsedTime * 1.9) * 0.3;

      composer.render();
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      const w = widget.clientWidth;
      const h = widget.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });
  </script>
</body>
</html>
